# Mutation testing (mutmut): small deliberate bugs are planted in the engine
# and the unit tests are run against each one. A test suite worth trusting
# fails for (kills) almost all of them.
#   mutmut run && mutmut results
[mutmut]
source_paths = recommender.py
also_copy =
    tests
    pytest.ini
pytest_add_cli_args_test_selection =
    tests/unit
